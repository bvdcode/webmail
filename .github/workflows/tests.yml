name: Tests

on:
  push:
  pull_request:

jobs:
  vitest:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the version the standalone release build uses; the repo has
          # no .nvmrc or "engines" field to read it from.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit

      - name: Run test suite
        # forks + a small worker count keeps the load-sensitive component tests
        # from timing out on the shared runners; the longer per-test timeout
        # covers the jsdom-heavy suites.
        run: npm run test -- --pool=forks --maxWorkers=2 --testTimeout=15000
